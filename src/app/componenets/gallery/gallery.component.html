<section id="gallery" class="overflow-hidden">
  <div class="wrapper container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 mb-5">
        <section class="title-text-wrapper">
          <div class="content text-center" data-aos="slide-down">
            <h2>{{"HEADER.NAVBAR.GALLERY"|translate}}</h2>
            <h2>{{"HEADER.NAVBAR.GALLERY"|translate}}</h2>
          </div>
        </section>
      </div>
      <div class="slider-gallery col-md-12 col-12 p-5">
        <div class="row justify-content-center ">
          <p-image *ngFor="let image of images" src="{{image}}" [preview]="false" alt="Image"  height="500" class="col-md-3 col-12 my-2">
            <ng-template #indicator>
              <i class="pi pi-search"></i>
            </ng-template>
            <ng-template #image>
              <img src="{{image}}" alt="image" height="500" />
            </ng-template>
            <ng-template #preview let-style="style" let-previewCallback="previewCallback">
              <img src="{{image}}" alt="image" [style]="style" (click)="previewCallback()" />
            </ng-template>
          </p-image>
        </div>
      </div>
    </div>
  </div>
